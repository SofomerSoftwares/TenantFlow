services:
  # Full-Stack Web Service for Tenant List Updater on Render
  - type: web
    name: tenant-list-updater
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/db/status
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # MySQL Database Engine Configuration
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: tenant_updater
      - key: MYSQL_SSL
        value: "false"
      - key: DATABASE_URL
        sync: false
      # Application URLs and Secrets
      - key: APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
